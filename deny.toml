# Supply-chain policy for the shipped crates.
#
# The allow-list below is DERIVED, not guessed: it is the exact set of distinct
# licenses present across solana-core and all eight plugin components, enumerated
# with `cargo deny list`. Every one is permissive. There is no GPL, LGPL, AGPL,
# MPL or SSPL anywhere in the graph, which is what makes the MIT license on this
# repo honest for redistribution rather than aspirational.
#
# Worth recording why this comes back clean when a Solana project usually cannot:
# these crates do not depend on `solana-sdk`. The wire format is decoded by hand,
# because solana-sdk does not compile for wasm32-wasip2 inside a WIT component.
# That was a constraint rather than a choice, and the second-order effect is that
# we do not inherit the Solana toolchain's well-known and unfixable transitive
# advisories. The Anchor workspace under onchain/ is a separate matter and is not
# part of the shipped plugin surface.
#
# Adding a license here should mean a new dependency genuinely introduced it. If
# an entry ever needs removing, that is the signal to look at what changed.

[advisories]
# A yanked crate is worth knowing about without failing the build over it.
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are normal in a graph this size and are not a defect worth
# a red gate. Advisories and licenses are the two questions that matter here.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
