# Supply-chain policy for the shipped crates.
#
# The allow-list below is DERIVED, not guessed: it is the exact set of distinct
# licenses present across solana-core, all eight plugin components, and the x402
# gate, enumerated with `cargo deny list`. Every one is permissive. There is no
# GPL, LGPL, AGPL, MPL or SSPL anywhere in the graph, which is what makes the MIT
# license on this repo honest for redistribution rather than aspirational.
#
# Two entries arrived together with the x402 gate, which pulls ureq and with it
# the usual Rust TLS stack. Both were checked before being added.
#
# CDLA-Permissive-2.0 covers webpki-roots, a bundle of root CA certificates. The
# Community Data License Agreement is built for exactly that shape, data rather
# than code, and it is permissive in the sense that matters here: the only
# obligation when redistributing is to carry the agreement text and the warranty
# and liability disclaimers along with the data. It places no condition on the
# rest of the aggregate, so shipping it inside an MIT repo is honest. It was
# checked against the license text rather than assumed from the name, because
# "Permissive" appearing in a title is not an argument.
#
# ISC covers untrusted and rustls-webpki, and appears once as the compound
# expression "Apache-2.0 AND ISC". It is the OpenBSD license, functionally
# equivalent to MIT and to BSD-2-Clause with the redundant clause removed, and
# both OSI and the FSF classify it as permissive.
#
# Neither is a copyleft foothold, so the "no GPL, LGPL, AGPL, MPL or SSPL"
# statement above survives them intact.
#
# Worth recording why this comes back clean when a Solana project usually cannot:
# these crates do not depend on `solana-sdk`. The wire format is decoded by hand,
# because solana-sdk does not compile for wasm32-wasip2 inside a WIT component.
# That was a constraint rather than a choice, and the second-order effect is that
# we do not inherit the Solana toolchain's well-known and unfixable transitive
# advisories. The Anchor workspace under onchain/ is a separate matter and is not
# part of the shipped plugin surface.
#
# Adding a license here should mean a new dependency genuinely introduced it. If
# an entry ever needs removing, that is the signal to look at what changed.

[advisories]
# A yanked crate is worth knowing about without failing the build over it.
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are normal in a graph this size and are not a defect worth
# a red gate. Advisories and licenses are the two questions that matter here.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
