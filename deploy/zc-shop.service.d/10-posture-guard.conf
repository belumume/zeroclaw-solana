# The WhatsApp posture guard's ExecStartPre, pointed at the deployed copy under ZEROCLAW_HOME.
#
# ================================ READ THIS FIRST ================================
# THIS FILE OVERWRITES A LIVE START GATE. A drop-in of this exact name already exists at
# ~/.config/systemd/user/zc-shop.service.d/10-posture-guard.conf and already supplies the
# ExecStartPre, naming /bin/bash and the home-directory copy at ~/whatsapp_posture_guard.sh.
# Installing this one repoints that gate rather than adding one, so BACK THE LIVE COPY UP
# FIRST. The install order in docs/POSTURE-GUARD-WIRING.md is not advice: the script must be
# at the path below and passing by hand BEFORE this file replaces the working drop-in, or the
# first start after a reload dies 203/EXEC against a path that is not there.
#
# THAT FAILURE HAS ALREADY HAPPENED ONCE IN THIS REPO, in deploy/x402-feed-gate.service, whose
# ExecStart was committed pointing at a binary that did not exist. Installing it verbatim would
# have taken the paywall down every start. A proposed Exec* line is a guess until the target is
# read back off the box.
#
# THE ESCAPE HATCH, one line, no editor, no repo checkout needed on the box:
#
#     cp ~/10-posture-guard.conf.bak ~/.config/systemd/user/zc-shop.service.d/10-posture-guard.conf && rm -f ~/.config/systemd/user/zc-shop.service.d/99-proof-badconfig.conf && systemctl --user daemon-reload && systemctl --user reset-failed zc-shop.service && systemctl --user restart zc-shop.service
#
# It restores the drop-in the box was already running and clears any 99- proof drop-in left
# behind by the two-way proof, which would otherwise keep refusing the start on its own. DO NOT
# `rm -rf` the .d directory
# instead: that directory predates this file and holds the gate, so removing it starts a shop
# with no pre-check at all. The unit file itself is never touched by any step here, which is
# the whole reason this is a drop-in rather than an edit.
# =================================================================================
#
# WHY A DROP-IN RATHER THAN EDITING zc-shop.service. The live unit has never been read into
# this repo -- it is not in deploy/ and not in git -- so there is no tracked copy to edit and no
# honest way to ship a full replacement. A `cp` of a guessed unit over a working one is the
# highest-consequence edit available on this box. A drop-in asserts exactly ONE line and is
# reviewable in full. Nothing else about the unit can change by accident.
#
# WHY THE SCRIPT PATH IS %h/.zeroclaw/bin AND NOT %h. The copy that has been running lives at
# ~/whatsapp_posture_guard.sh: outside ZEROCLAW_HOME, so no entry in deploy/deploy-targets.json
# can reach it, so nothing hashes it and nothing would notice it being edited. This repo already
# tracks the script at scripts/whatsapp_posture_guard.sh with two-way controls beside it, and
# those two copies have never been compared. %h/.zeroclaw/bin is where announce_settlements.sh
# and box_selfcheck.py already install, it is inside the drift manifest's reach, and the
# accompanying map entry puts this script's hash in SHOP-INVARIANTS.json. Pointing here is what
# converts the guard from an untracked orphan into a gated artifact.
#
# THERE IS NO `Environment=ZC_CONFIG=` LINE HERE AND ITS ABSENCE IS DELIBERATE. A drop-in
# Environment= applies to the WHOLE service, so it would also enter the daemon's environment at
# ExecStart, and a variable that changes the daemon's config resolution is not something to set
# as a side effect of wiring a pre-check. The guard defaults CFG to $HOME/.zeroclaw/config.toml
# (scripts/whatsapp_posture_guard.sh), HOME is set in a `--user` unit, so the default already
# resolves to the file the daemon reads. Leave it unset.
#
# NO LEADING `-` ON THE ExecStartPre BELOW, AND THAT IS THE POINT. `ExecStartPre=-/path/...`
# makes a non-zero exit non-fatal, which would restore exactly the fail-open this guard exists
# to remove: the check would run, print its refusal, and the shop would start anyway. If this
# drop-in is ever the thing standing between an outage and a working shop, restore the backup
# with the line above rather than defanging it in place -- that keeps a gate running, and
# deleting the gate outright is visible to the selfcheck's required-directive assertion where
# a leading dash is not.

[Service]
ExecStartPre=%h/.zeroclaw/bin/whatsapp_posture_guard.sh
