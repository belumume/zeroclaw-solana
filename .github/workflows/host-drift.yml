name: host-drift

# The most expensive near-miss in this build was invisible to every test.
#
# `wit/v0` is marked experimental and unfrozen upstream. Component-model interfaces
# match NOMINALLY, so when upstream restored one enum variant to `plugin-action`, our
# vendored copy became a different type and every plugin would have failed to register
# on a judge's from-source host, while `cargo build` and all tests stayed green. Two
# other entrants hit the same wall independently. It was caught by reading a chat
# channel, which is not a control.
#
# This is the control. It clones upstream HEAD and re-checks interface parity, so the
# next drift shows up as a notification instead of a dead demo.
#
# Separate from ci.yml on purpose: a red here means the OUTSIDE WORLD moved, not that
# our code broke, and those two signals should never share a badge.

# Least privilege, declared here rather than inherited. Without this block the token's scope comes
# from the repo-level "default workflow permissions" setting, which is currently read -- so this was
# safe by a checkbox rather than by anything in the file. Flipping that default to read-and-write
# would silently hand a write token to a workflow that runs third-party actions, and nothing in the
# diff would show it. Declaring it makes the grant reviewable.
permissions:
  contents: read

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wit/**"
      - "scripts/check-host-compat.sh"
      - ".github/workflows/host-drift.yml"

jobs:
  wit-parity:
    name: do our components still match upstream's interface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # HEAD, not the pinned commit. Pinning is what QUICKSTART documents for
      # reproduction; the point here is to notice the day upstream moves.
      - name: Clone upstream host (HEAD)
        run: |
          git clone --depth 1 https://github.com/zeroclaw-labs/zeroclaw.git /tmp/zeroclaw-host
          echo "upstream HEAD: $(git -C /tmp/zeroclaw-host rev-parse --short HEAD)"

      - name: Install the wasm target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The check refuses a COMPATIBLE verdict while any plugin is unbuilt, so every one
      # must exist before it can say anything meaningful.
      #
      # SCOPE IS DISCOVERED, NOT LISTED, matching the fmt job in ci.yml. This was a
      # hand-written list of eight, which is the shape that silently loses a plugin added
      # later: it would build and pass while the new component's WIT parity went unchecked,
      # and interface drift is a whole-fleet failure rather than a per-plugin one. The floor
      # is what makes a broken walk fail loudly instead of building nothing and reporting
      # success, which is the same defect one layer down.
      - name: Build every component
        run: |
          set -euo pipefail
          n=0
          for m in plugins/*/manifest.toml; do
            d=$(dirname "$m")
            (cd "$d" && cargo build --target wasm32-wasip2 --release --locked)
            n=$((n + 1))
          done
          echo "built $n component(s)"
          if [ "$n" -lt 9 ]; then
            echo "discovery found $n plugins, fewer than the 9 that exist today; the walk is" \
                 "broken, refusing to report parity" >&2
            exit 1
          fi

      # Skips only the three host-binary feature checks, which would need a full host
      # build. WIT parity and the per-component variant check are the ones that catch
      # drift, and they run in full. The skip is printed, not silent.
      - name: Interface parity against upstream HEAD
        env:
          ZC_SKIP_HOST_BINARY: "1"
        run: ./scripts/check-host-compat.sh /tmp/zeroclaw-host

      # A SECOND upstream dependency, and unlike the WIT it is a SECURITY one.
      #
      # Every funds-touching plugin here reads its receiver, mint and spend cap from `__config`
      # and cross-checks a remote 402 challenge against them. `__config` is a normal serde field,
      # so `deny_unknown_fields` admits it rather than excluding it: if a model could supply that
      # section, it would be checking a challenge against values it chose itself, and the payee
      # binding would be decorative. An audit rated exactly that a HIGH.
      #
      # It does not hold, because the HOST strips a caller-supplied section before injecting the
      # operator's. That is upstream code we do not control, it is the sole thing standing between
      # a prompt-injected agent and an arbitrary payee, and no plugin can defend itself against
      # its removal. The WIT arrived out of parity three times; this is the same class with a
      # worse blast radius, so it gets watched rather than trusted.
      # `if: always()` IS LOAD-BEARING HERE, NOT HYGIENE. Without it this step inherits default
      # step semantics and never runs once the parity step above goes red -- and that step reddens
      # on ORDINARY UPSTREAM MOVEMENT, which is the resting state of a drift canary rather than an
      # incident. Measured: this step was reported `skipped` on every red run from 2026-08-23 to
      # 2026-08-26 inclusive, so the one check in this file that is about SECURITY rather than
      # about interface drift was dark for the entire window in which the interface check was
      # doing its job. The two are independent questions and neither may silence the other. It
      # costs nothing: this workflow is a notification, attaches to no required context, and gates
      # nothing either way. Re-derive rather than trusting that sentence:
      #   gh run list --workflow=host-drift.yml --limit 10 --json databaseId,conclusion -q '.[].databaseId' \
      #     | while read -r r; do gh api "repos/{owner}/{repo}/actions/runs/$r/jobs" \
      #         --jq '.jobs[].steps[] | select(.name|test("__config")) | .conclusion'; done
      #
      # A MISSING CLONE IS `CANNOT CHECK`, NOT A FINDING. With `always()` this step also runs when
      # the clone step itself failed, and "the file is not there" would then read as "upstream
      # deleted the strip" -- a security alarm manufactured by a network blip, in the alarming
      # direction. The two states are separated before either verdict is printed.
      - name: The host still strips a caller-supplied __config
        if: always()
        run: |
          set -euo pipefail
          H=/tmp/zeroclaw-host
          F="$H/crates/zeroclaw-plugins/src/runtime.rs"
          if [ ! -d "$H" ]; then
            echo "::warning::CANNOT CHECK: the upstream clone at $H is absent, so nothing was read."
            echo "::warning::That is a failed clone, NOT evidence the strip was removed. Re-run this workflow."
            exit 0
          fi
          test -f "$F" || { echo "::error::$F is gone; the injection point moved and this check is blind"; exit 1; }
          # Assert on the CODE, not the comment beside it: a docstring can keep promising this
          # after the line is deleted.
          grep -q 'obj\.remove("__config")' "$F" || {
            echo "::error::upstream no longer strips a caller-supplied __config in inject_config."
            echo "::error::A model that can set that section chooses its own payee. Read $F before shipping anything that pays."
            exit 1
          }
          # CONTROL: prove the grep can miss, or a pass says only that the file exists.
          grep -q 'obj\.remove("__definitely_not_a_real_key")' "$F" \
            && { echo "::error::control matched an absent string; this grep proves nothing"; exit 1; } || true
          echo "ok    upstream still strips caller-supplied __config (control fired correctly)"

      # The HEAD check above answers "did upstream move." It does NOT answer "does the
      # reproduction we published still work," and those come apart precisely here: the
      # pinned commit is known to be out of parity, which is why QUICKSTART instructs two
      # manual edits. So HEAD could stay green indefinitely while every stranger following
      # our own instructions builds a host that registers nothing. That is the failure this
      # workflow exists to prevent, pointed at the one path we actually tell people to walk.
      #
      # The pin is read OUT of QUICKSTART rather than repeated here. A second copy is a
      # second thing to drift, and drift in the instructions is the exact defect being
      # guarded: this same interface mismatch has now arrived three times, most recently
      # through prose that no automation was watching.
      - name: Does our own documented reproduction still register plugins
        if: always()
        env:
          ZC_SKIP_HOST_BINARY: "1"
        run: |
          set -euo pipefail
          PIN=$(grep -oP 'git checkout \K[0-9a-f]{7,40}' QUICKSTART.md | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read the pinned host commit out of QUICKSTART.md."
            echo "If the pin moved or the wording changed, this guard went blind. Fix the"
            echo "parser rather than deleting the step."
            exit 1
          fi
          echo "QUICKSTART pins: $PIN"

          git clone https://github.com/zeroclaw-labs/zeroclaw.git /tmp/pinned-host
          git -C /tmp/pinned-host checkout --quiet "$PIN"

          # Apply exactly the two edits QUICKSTART calls REQUIRED, and fail loudly if either
          # no longer applies. If upstream changes shape so the documented patch stops
          # working, the instructions are wrong and a reader is stranded.
          W=/tmp/pinned-host/wit/v0/logging.wit
          C=/tmp/pinned-host/crates/zeroclaw-plugins/src/component_logging.rs

          if grep -q 'memory-audit' "$W"; then
            echo "::notice::pinned commit already carries memory-audit; QUICKSTART's REQUIRED"
            echo "patch step is now stale and should be simplified."
          else
            perl -0pi -e 's/(\n(\s*))note,/\n$2note,\n$2memory-audit,/' "$W"
            grep -q 'memory-audit' "$W" || {
              echo "::error::the documented wit edit no longer applies at $PIN."; exit 1; }
          fi

          if ! grep -q 'PluginAction::MemoryAudit' "$C"; then
            perl -0pi -e 's/(\n(\s*))(PluginAction::Note => Action::Note,)/\n$2$3\n$2PluginAction::MemoryAudit => Action::Note,/' "$C"
            grep -q 'PluginAction::MemoryAudit' "$C" || {
              echo "::error::the documented component_logging edit no longer applies at $PIN."
              echo "QUICKSTART tells readers to add this arm; it did not land."; exit 1; }
          fi

          # The sharpest assertion available, and it needs no host build: after following
          # our own instructions the host's interface file should be byte-identical to the
          # copy our components were compiled against. Nominal matching means anything less
          # than identical is a different type and nothing registers.
          if diff <(sed 's/[[:space:]]*$//' "$W") <(sed 's/[[:space:]]*$//' wit/v0/logging.wit); then
            echo "patched host wit is byte-identical to our vendored wit/v0/logging.wit"
          else
            echo "::error::after applying QUICKSTART's REQUIRED patch, the host's wit still"
            echo "differs from ours (diff above). A reader following the instructions exactly"
            echo "would get discovered: N, registered: 0."
            exit 1
          fi

          ./scripts/check-host-compat.sh /tmp/pinned-host

      # HOW TO READ A RED HERE, printed at the moment it goes red rather than left in a document
      # nobody opens while triaging.
      #
      # This workflow is a NOTIFICATION, not a build gate: it is deliberately separate from ci.yml
      # because a red means the OUTSIDE WORLD moved. But a canary that stays red gets learned
      # around, and then it says nothing on the day it is right, so the red needs to carry its own
      # triage instead of leaving every reader to re-derive the same classification.
      #
      # The two steps above answer DIFFERENT questions and only one of them is urgent:
      #
      #   HEAD parity  (the step that usually reddens)  upstream moved. Our components are compiled
      #                                                 against the vendored copy and keep working.
      #   PIN parity   (the step below it)              our own DOCUMENTED reproduction broke. A
      #                                                 stranger following QUICKSTART gets
      #                                                 `registered: 0`. This one is urgent.
      #
      # And within HEAD parity the classes are not equal. The step below prints exactly these four,
      # one label per difference, because a single red is routinely made of several unrelated
      # changes and collapsing them is how the urgent one gets waved through with the noise:
      #
      #   COSMETIC      a doc comment moved. Comments are not part of a component type, so nothing
      #                 about registration changes. This is most of the traffic.
      #   ADDITIVE      the host's world gained an IMPORT we never ask for. The host SATISFIES
      #                 imports, so offering one that no component imports leaves every component's
      #                 type alone. Re-vendor when convenient, not urgently.
      #   BREAKING      any of three, and they are genuinely different failures: a type we vendor
      #                 changed SHAPE (a variant added to `plugin-action` is the known case); the
      #                 world gained an EXPORT we do not provide, which is looked up ON the
      #                 component at instantiation and is simply absent; or OUR world imports
      #                 something the host no longer offers, leaving an import nothing can resolve.
      #   CANNOT CHECK  an anchor moved and nothing was compared. This is NOT an all-clear, and the
      #                 step refuses rather than falling through to the reassuring class.
      #
      # WHY THE CLASSIFIER IS NOT JUST THE ENUM. `plugin-action` is the drift that bit us, so it
      # was the only thing classified. Today's red contains no enum change at all: it is one
      # world-membership change (`import secrets;`, added upstream 2026-08-22) and one doc comment
      # in `logging.wit`. An enum comparison sees neither, so it could not classify any part of the
      # red it was standing in front of.
      #
      # BY HAND, against the clone this job already made. Upstream's WIT lives at the REPO ROOT,
      # `wit/v0/`, NOT under `crates/zeroclaw-plugins/` -- that directory holds only AGENTS.md,
      # Cargo.toml, src and tests. `scripts/check-host-compat.sh` reads `$HOST/wit/v0` for the same
      # reason. The authority, which is what the parity step above runs:
      #   ZC_SKIP_HOST_BINARY=1 ./scripts/check-host-compat.sh /tmp/zeroclaw-host
      # And the `plugin-action` case alone, on one line so it survives a copy-paste:
      #   diff <(sed -n '/enum plugin-action/,/}/p' wit/v0/logging.wit | tr -d '\r') <(sed -n '/enum plugin-action/,/}/p' /tmp/zeroclaw-host/wit/v0/logging.wit | tr -d '\r')
      # `tr -d '\r'` matches what check-host-compat.sh already does; without it a CRLF checkout
      # reports BREAKING on a byte-identical enum, which is the alarming direction.
      #
      # THREE SEPARATE THINGS, kept apart because only one of them is a deferral:
      #
      #   1. THE RE-VENDOR IS DEFERRED ON MECHANISM, not on effort. Taking the host's current
      #      `tool.wit` means taking `import secrets;` with it, which narrows the compatibility
      #      envelope onto hosts at or after 2026-08-22 and OFF the pinned commit that QUICKSTART,
      #      the frozen submission branch, the demo and the proof bundle all name. And
      #      `check-host-compat.sh` derives the world from the HOST with no subset allowance, so
      #      there is no partial re-vendor available: it is all of it or none of it.
      #   2. THE COMPENSATING CONTROL IS THE PIN-PARITY STEP ABOVE. It asserts our `logging.wit`
      #      is byte-identical to the PINNED host after QUICKSTART's REQUIRED patch, so the path a
      #      reader actually walks is checked on every run. That is what makes the deferral safe
      #      rather than merely convenient, and it is why syncing to HEAD would turn a passing
      #      check red. Moving the pin and the QUICKSTART instructions together is the whole job.
      #   3. THE `__config` CANARY IS UNRELATED TO EITHER. It watches a host-side SECURITY
      #      behaviour, not an interface. Re-vendoring would not affect it, and its verdict says
      #      nothing about whether to re-vendor. It shares this workflow only because it happens to
      #      need the same upstream clone.
      - name: how to triage this red
        if: failure()
        run: |
          set -uo pipefail
          H=/tmp/zeroclaw-host
          echo "::notice::host-drift is a NOTIFICATION workflow. Red here means UPSTREAM moved."
          echo "Classify before acting -- the comment block above this step has the full ladder."

          if [ ! -d "$H/wit/v0" ]; then
            echo "::warning::CANNOT CHECK: $H/wit/v0 does not exist, so nothing was compared."
            echo "::warning::Either the clone step failed or upstream moved wit/v0. Classify by hand."
            echo "::warning::Do NOT read this as ADDITIVE -- no comparison happened."
            exit 0
          fi
          echo "denominator: wit files ours=$(ls wit/v0/*.wit 2>/dev/null | wc -l), upstream=$(ls "$H"/wit/v0/*.wit 2>/dev/null | wc -l)"

          # SCOPE comes from check-host-compat.sh's OWN derivation rather than a second copy of it.
          # Re-deriving the tool-plugin world here is exactly how the two drift apart, and drift is
          # the thing being triaged. Comparing the whole directory instead would drag in
          # channel/memory/sockets/ws-client, which cannot affect a tool plugin and whose noise is
          # what trains people to ignore a canary. A wording change over there yields an EMPTY
          # parse, which lands on CANNOT CHECK below rather than on a reassuring verdict.
          MEMBERS=$(ZC_SKIP_HOST_BINARY=1 ./scripts/check-host-compat.sh "$H" 2>&1 \
                    | sed -n 's/^ *world members (derived from the host): *//p' | head -1)
          if [ -z "${MEMBERS// /}" ]; then
            echo "::warning::CANNOT CHECK: could not read the derived tool-plugin world out of"
            echo "::warning::check-host-compat.sh. Its derivation failed, or its output wording moved."
            exit 0
          fi
          echo "world members in scope (derived, not listed): $MEMBERS"

          world_pairs() {
            sed -n "/^[[:space:]]*world[[:space:]]\+tool-plugin[[:space:]]*{/,/^[[:space:]]*}/p" "$1" 2>/dev/null \
              | tr -d '\r' | grep -oE "^[[:space:]]*(import|export)[[:space:]]+[a-z][a-z0-9-]*" \
              | awk '{print $1" "$2}' | sort -u
          }
          # Three normalizations, and the middle one is what stops a membership change being
          # reported twice under two different labels. raw -> nonworld is exactly the world block,
          # which section 1 owns. nonworld -> code is exactly the comments, which is what separates
          # COSMETIC from BREAKING.
          nonworld() {
            tr -d '\r' < "$1" \
              | sed '/^[[:space:]]*world[[:space:]]\+tool-plugin[[:space:]]*{/,/^[[:space:]]*}$/d'
          }
          code() { nonworld "$1" | sed -e 's://.*::' -e 's/[[:space:]]*$//' | grep -v '^$'; }

          OURSEED=$(grep -lE "^[[:space:]]*world[[:space:]]+tool-plugin[[:space:]]*\{" wit/v0/*.wit 2>/dev/null | head -1)
          THEIRSEED=$(grep -lE "^[[:space:]]*world[[:space:]]+tool-plugin[[:space:]]*\{" "$H"/wit/v0/*.wit 2>/dev/null | head -1)
          BREAKING=0; ADDITIVE=0; COSMETIC=0; UNKNOWN=0

          echo ""
          echo "1. WORLD MEMBERSHIP  (what the host offers vs what our components were compiled to ask for)"
          if [ -z "$OURSEED" ] || [ -z "$THEIRSEED" ]; then
            echo "  ::warning::CANNOT CHECK: 'world tool-plugin' not found in one or both trees"
            echo "            (ours='${OURSEED:-none}' upstream='${THEIRSEED:-none}'). The anchor moved."
            UNKNOWN=$((UNKNOWN + 1))
          else
            OP=$(world_pairs "$OURSEED"); TP=$(world_pairs "$THEIRSEED")
            echo "  members: ours=$(printf %s "$OP" | grep -c . || true), upstream=$(printf %s "$TP" | grep -c . || true)"
            if [ -z "$OP" ] || [ -z "$TP" ]; then
              echo "  ::warning::CANNOT CHECK: a world block was found but yielded no import/export lines."
              UNKNOWN=$((UNKNOWN + 1))
            else
              while read -r kind name; do
                [ -z "${name:-}" ] && continue
                if [ "$kind" = export ]; then
                  echo "  ::error::BREAKING  upstream's world now EXPORTS '$name' and our components do not."
                  echo "            An export is looked up ON the component at instantiation. It is absent, so nothing registers."
                  BREAKING=$((BREAKING + 1))
                else
                  echo "  ADDITIVE  upstream's world now IMPORTS '$name', which our components never ask for."
                  echo "            The host satisfies imports; offering one nobody imports changes no component's type."
                  ADDITIVE=$((ADDITIVE + 1))
                fi
              done <<< "$(comm -13 <(printf '%s\n' "$OP") <(printf '%s\n' "$TP"))"
              while read -r kind name; do
                [ -z "${name:-}" ] && continue
                if [ "$kind" = import ]; then
                  echo "  ::error::BREAKING  our world IMPORTS '$name' and upstream's no longer offers it."
                  echo "            Our components carry an import the host cannot resolve; instantiation fails."
                  BREAKING=$((BREAKING + 1))
                else
                  echo "  ADDITIVE  our world EXPORTS '$name' and upstream's no longer asks for it. An unused export is inert."
                  ADDITIVE=$((ADDITIVE + 1))
                fi
              done <<< "$(comm -23 <(printf '%s\n' "$OP") <(printf '%s\n' "$TP"))"
            fi
          fi

          echo ""
          echo "2. TYPE SHAPE  (per world member we vendor: does the code differ, or only the prose around it)"
          for f in $MEMBERS; do
            ours="wit/v0/$f"; theirs="$H/wit/v0/$f"
            if [ ! -f "$theirs" ]; then
              echo "  ::warning::CANNOT CHECK  $f: named by the world, absent from the host clone"
              UNKNOWN=$((UNKNOWN + 1)); continue
            fi
            if [ ! -f "$ours" ]; then
              echo "  (not vendored) $f -- membership above already classified this"; continue
            fi
            if diff -q <(code "$ours") <(code "$theirs") >/dev/null 2>&1; then
              if diff -q <(nonworld "$ours") <(nonworld "$theirs") >/dev/null 2>&1; then
                if diff -q <(tr -d '\r' < "$ours") <(tr -d '\r' < "$theirs") >/dev/null 2>&1; then
                  echo "  identical $f"
                else
                  echo "  (world block only) $f -- section 1 owns this, it is not a comment change"
                fi
              else
                echo "  COSMETIC  $f: comments or blank lines only. Not part of the component type."
                COSMETIC=$((COSMETIC + 1))
              fi
            else
              echo "  ::error::BREAKING  $f: the CODE differs, so this is a different type and nothing registers."
              diff <(code "$ours") <(code "$theirs") | head -8 | sed 's/^/            /'
              BREAKING=$((BREAKING + 1))
            fi
          done

          echo ""
          echo "VERDICT  breaking=$BREAKING additive=$ADDITIVE cosmetic=$COSMETIC cannot-check=$UNKNOWN"
          if [ "$BREAKING" -gt 0 ]; then
            echo "::error::BREAKING drift. Re-vendor and move the pin before shipping anything."
          elif [ "$UNKNOWN" -gt 0 ]; then
            echo "::warning::PARTIALLY CLASSIFIED: $UNKNOWN check(s) could not look. Not an all-clear."
          elif [ "$ADDITIVE" -gt 0 ] || [ "$COSMETIC" -gt 0 ]; then
            echo "::notice::ADDITIVE/COSMETIC only -- our components still register. Re-vendor when convenient."
          else
            echo "::notice::no interface drift found here; the red came from another step."
          fi
