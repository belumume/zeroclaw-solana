name: host-drift

# The most expensive near-miss in this build was invisible to every test.
#
# `wit/v0` is marked experimental and unfrozen upstream. Component-model interfaces
# match NOMINALLY, so when upstream restored one enum variant to `plugin-action`, our
# vendored copy became a different type and every plugin would have failed to register
# on a judge's from-source host, while `cargo build` and all tests stayed green. Two
# other entrants hit the same wall independently. It was caught by reading a chat
# channel, which is not a control.
#
# This is the control. It clones upstream HEAD and re-checks interface parity, so the
# next drift shows up as a notification instead of a dead demo.
#
# Separate from ci.yml on purpose: a red here means the OUTSIDE WORLD moved, not that
# our code broke, and those two signals should never share a badge.

# Least privilege, declared here rather than inherited. Without this block the token's scope comes
# from the repo-level "default workflow permissions" setting, which is currently read -- so this was
# safe by a checkbox rather than by anything in the file. Flipping that default to read-and-write
# would silently hand a write token to a workflow that runs third-party actions, and nothing in the
# diff would show it. Declaring it makes the grant reviewable.
permissions:
  contents: read

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wit/**"
      - "scripts/check-host-compat.sh"
      - ".github/workflows/host-drift.yml"

jobs:
  wit-parity:
    name: do our components still match upstream's interface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # HEAD, not the pinned commit. Pinning is what QUICKSTART documents for
      # reproduction; the point here is to notice the day upstream moves.
      - name: Clone upstream host (HEAD)
        run: |
          git clone --depth 1 https://github.com/zeroclaw-labs/zeroclaw.git /tmp/zeroclaw-host
          echo "upstream HEAD: $(git -C /tmp/zeroclaw-host rev-parse --short HEAD)"

      - name: Install the wasm target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # The check refuses a COMPATIBLE verdict while any plugin is unbuilt, so every one
      # must exist before it can say anything meaningful.
      #
      # SCOPE IS DISCOVERED, NOT LISTED, matching the fmt job in ci.yml. This was a
      # hand-written list of eight, which is the shape that silently loses a plugin added
      # later: it would build and pass while the new component's WIT parity went unchecked,
      # and interface drift is a whole-fleet failure rather than a per-plugin one. The floor
      # is what makes a broken walk fail loudly instead of building nothing and reporting
      # success, which is the same defect one layer down.
      - name: Build every component
        run: |
          set -euo pipefail
          n=0
          for m in plugins/*/manifest.toml; do
            d=$(dirname "$m")
            (cd "$d" && cargo build --target wasm32-wasip2 --release --locked)
            n=$((n + 1))
          done
          echo "built $n component(s)"
          if [ "$n" -lt 9 ]; then
            echo "discovery found $n plugins, fewer than the 9 that exist today; the walk is" \
                 "broken, refusing to report parity" >&2
            exit 1
          fi

      # Skips only the three host-binary feature checks, which would need a full host
      # build. WIT parity and the per-component variant check are the ones that catch
      # drift, and they run in full. The skip is printed, not silent.
      - name: Interface parity against upstream HEAD
        env:
          ZC_SKIP_HOST_BINARY: "1"
        run: ./scripts/check-host-compat.sh /tmp/zeroclaw-host

      # A SECOND upstream dependency, and unlike the WIT it is a SECURITY one.
      #
      # Every funds-touching plugin here reads its receiver, mint and spend cap from `__config`
      # and cross-checks a remote 402 challenge against them. `__config` is a normal serde field,
      # so `deny_unknown_fields` admits it rather than excluding it: if a model could supply that
      # section, it would be checking a challenge against values it chose itself, and the payee
      # binding would be decorative. An audit rated exactly that a HIGH.
      #
      # It does not hold, because the HOST strips a caller-supplied section before injecting the
      # operator's. That is upstream code we do not control, it is the sole thing standing between
      # a prompt-injected agent and an arbitrary payee, and no plugin can defend itself against
      # its removal. The WIT arrived out of parity three times; this is the same class with a
      # worse blast radius, so it gets watched rather than trusted.
      - name: The host still strips a caller-supplied __config
        run: |
          set -euo pipefail
          F=/tmp/zeroclaw-host/crates/zeroclaw-plugins/src/runtime.rs
          test -f "$F" || { echo "::error::$F is gone; the injection point moved and this check is blind"; exit 1; }
          # Assert on the CODE, not the comment beside it: a docstring can keep promising this
          # after the line is deleted.
          grep -q 'obj\.remove("__config")' "$F" || {
            echo "::error::upstream no longer strips a caller-supplied __config in inject_config."
            echo "::error::A model that can set that section chooses its own payee. Read $F before shipping anything that pays."
            exit 1
          }
          # CONTROL: prove the grep can miss, or a pass says only that the file exists.
          grep -q 'obj\.remove("__definitely_not_a_real_key")' "$F" \
            && { echo "::error::control matched an absent string; this grep proves nothing"; exit 1; } || true
          echo "ok    upstream still strips caller-supplied __config (control fired correctly)"

      # The HEAD check above answers "did upstream move." It does NOT answer "does the
      # reproduction we published still work," and those come apart precisely here: the
      # pinned commit is known to be out of parity, which is why QUICKSTART instructs two
      # manual edits. So HEAD could stay green indefinitely while every stranger following
      # our own instructions builds a host that registers nothing. That is the failure this
      # workflow exists to prevent, pointed at the one path we actually tell people to walk.
      #
      # The pin is read OUT of QUICKSTART rather than repeated here. A second copy is a
      # second thing to drift, and drift in the instructions is the exact defect being
      # guarded: this same interface mismatch has now arrived three times, most recently
      # through prose that no automation was watching.
      - name: Does our own documented reproduction still register plugins
        if: always()
        env:
          ZC_SKIP_HOST_BINARY: "1"
        run: |
          set -euo pipefail
          PIN=$(grep -oP 'git checkout \K[0-9a-f]{7,40}' QUICKSTART.md | head -1)
          if [ -z "$PIN" ]; then
            echo "::error::could not read the pinned host commit out of QUICKSTART.md."
            echo "If the pin moved or the wording changed, this guard went blind. Fix the"
            echo "parser rather than deleting the step."
            exit 1
          fi
          echo "QUICKSTART pins: $PIN"

          git clone https://github.com/zeroclaw-labs/zeroclaw.git /tmp/pinned-host
          git -C /tmp/pinned-host checkout --quiet "$PIN"

          # Apply exactly the two edits QUICKSTART calls REQUIRED, and fail loudly if either
          # no longer applies. If upstream changes shape so the documented patch stops
          # working, the instructions are wrong and a reader is stranded.
          W=/tmp/pinned-host/wit/v0/logging.wit
          C=/tmp/pinned-host/crates/zeroclaw-plugins/src/component_logging.rs

          if grep -q 'memory-audit' "$W"; then
            echo "::notice::pinned commit already carries memory-audit; QUICKSTART's REQUIRED"
            echo "patch step is now stale and should be simplified."
          else
            perl -0pi -e 's/(\n(\s*))note,/\n$2note,\n$2memory-audit,/' "$W"
            grep -q 'memory-audit' "$W" || {
              echo "::error::the documented wit edit no longer applies at $PIN."; exit 1; }
          fi

          if ! grep -q 'PluginAction::MemoryAudit' "$C"; then
            perl -0pi -e 's/(\n(\s*))(PluginAction::Note => Action::Note,)/\n$2$3\n$2PluginAction::MemoryAudit => Action::Note,/' "$C"
            grep -q 'PluginAction::MemoryAudit' "$C" || {
              echo "::error::the documented component_logging edit no longer applies at $PIN."
              echo "QUICKSTART tells readers to add this arm; it did not land."; exit 1; }
          fi

          # The sharpest assertion available, and it needs no host build: after following
          # our own instructions the host's interface file should be byte-identical to the
          # copy our components were compiled against. Nominal matching means anything less
          # than identical is a different type and nothing registers.
          if diff <(sed 's/[[:space:]]*$//' "$W") <(sed 's/[[:space:]]*$//' wit/v0/logging.wit); then
            echo "patched host wit is byte-identical to our vendored wit/v0/logging.wit"
          else
            echo "::error::after applying QUICKSTART's REQUIRED patch, the host's wit still"
            echo "differs from ours (diff above). A reader following the instructions exactly"
            echo "would get discovered: N, registered: 0."
            exit 1
          fi

          ./scripts/check-host-compat.sh /tmp/pinned-host
