name: ci

# Runs on a clean machine what the write-up asks a judge to run on theirs.
# Everything here is offline and deterministic: no RPC, no devnet, no secrets.
# The live on-chain claims are re-checked separately by proof-check.yml, so a
# devnet outage can never turn this red and make working code look broken.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: solana-core (tests, properties, lints, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target the components ship as
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/solana-core

      # --locked so a green run proves the committed lockfile is the one that works.
      - name: Host tests and property tests
        working-directory: crates/solana-core
        run: cargo test --locked

      - name: Clippy, host, warnings are errors
        working-directory: crates/solana-core
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy, wasm32-wasip2, warnings are errors
        working-directory: crates/solana-core
        run: cargo clippy --target wasm32-wasip2 --locked -- -D warnings

      - name: Build the shipped wasm target
        working-directory: crates/solana-core
        run: cargo build --target wasm32-wasip2 --release --locked

      # The custody claim, checked rather than asserted: a good publish tx is
      # certified and four injection shapes are refused.
      - name: Fail-closed action certification self-test
        run: python3 scripts/certify_publish_tx.py

  fmt:
    name: rustfmt, every tracked crate
    runs-on: ubuntu-latest
    # This gate did not exist until 2026-08-01, and its absence was not theoretical:
    # 12 of 16 tracked crates were unformatted on main, including solana-core, while
    # the compliance ledger listed "cargo fmt --check clean" as part of the quality
    # bar. A bar nothing enforces is a bar the repo drifts off, and a judge finds
    # that in one command.
    #
    # SCOPE IS DISCOVERED, NOT LISTED. The supply-chain matrix below enumerates its
    # ten manifests by hand, which is correct there because it deliberately gates
    # only what SHIPS. Formatting has no such boundary: everything tracked is
    # readable by a judge, so this walks git's own index instead. A hand-written
    # list is exactly how the drift above happened, since a crate added later joins
    # no list by itself.
    steps:
      - uses: actions/checkout@v4

      - name: Every tracked crate is formatted
        run: |
          set -euo pipefail
          dirty=0
          count=0
          while read -r manifest; do
            dir=$(dirname "$manifest")
            # [package] only: a virtual workspace manifest has no crate to format,
            # and a path under src/ is a fixture rather than a crate.
            grep -q '^\[package\]' "$manifest" || continue
            case "$dir" in */src/*) continue;; esac
            count=$((count + 1))
            if (cd "$dir" && cargo fmt --check >/dev/null 2>&1); then
              echo "  clean   $dir"
            else
              echo "  DIRTY   $dir"
              dirty=$((dirty + 1))
            fi
          done < <(git ls-files '*Cargo.toml' | sort)
          echo
          echo "$((count - dirty))/$count tracked crates formatted"
          # A discovered scope can silently shrink to nothing if the walk breaks, and
          # zero crates checked would pass every assertion above. This is the floor
          # that stops a broken discovery step reading as a clean repo.
          if [ "$count" -lt 16 ]; then
            echo "discovery found only $count crates, expected at least 16; the walk is broken" >&2
            exit 1
          fi
          if [ "$dirty" -ne 0 ]; then
            echo "run: cd <dir> && cargo fmt" >&2
            exit 1
          fi

  proofs:
    name: kani proofs on shortvec
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Both harnesses take seconds to solve; the setup is the slow part, which is
      # why this is its own job rather than a step that delays the main gate.
      - uses: model-checking/kani-github-action@v1.1
        with:
          working-directory: crates/solana-core
          args: >-
            --harness accepted_encodings_are_uniquely_canonical
            --harness every_u16_roundtrips

  publish-gates:
    name: repo paths resolve, no shadowed scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history is not needed, but the default shallow checkout still gives
      # git ls-files everything these two read, since both ask about the INDEX
      # rather than about history.
      - uses: actions/checkout@v4

      # Two of the four pre-publish gates run here and two deliberately do not.
      #
      # These two are pure git plus filesystem: same answer on any machine, no
      # network, no local state. That makes them meaningful on a runner, and a
      # runner is the only place they run at all, since a gate that fires only
      # when someone remembers to type it is close to no gate.
      #
      # check-doc-links.py is NOT here on purpose, and the reason is no longer the
      # one this comment gave for weeks. It said the gate goes red on unfilled
      # repo-URL placeholders. There are none: the placeholders were filled once
      # it was established that a repository URL derives from owner and name, so
      # visibility never gated it. Grepping the three prose docs for them returns
      # nothing.
      #
      # The real residual is narrower and clears on one event. An anonymous
      # request for a PRIVATE repository returns 404, and the checker cannot tell
      # that from a URL that was never valid, so the gate reports one problem
      # until the repository is public and then reports none. Wiring a known-red
      # check in would train a reader to ignore a red badge, so it still goes in
      # at publish, but for that reason rather than the stale one.
      #
      # A second red was retired rather than deferred, because it could never
      # clear on any event. QUICKSTART illustrates an SSH tunnel with
      # 127.0.0.1:8899, and fetching a loopback address measures whoever runs the
      # checker: red on a runner, GREEN on a reader who started the local
      # validator that QUICKSTART tells them to start. A result that depends on
      # unrelated local state is not a check, so loopback is now a skip class
      # beside the two that already existed, with both-direction controls in
      # scripts/test_check_doc_links.py.
      #
      # check-config-drift.py is NOT here because it compares the documented
      # posture against a config on the operator's machine. A runner has no such
      # file, so it would be asserting nothing while looking like coverage.
      - name: every repo path a doc names is itself tracked
        run: python3 scripts/check-repo-paths.py

      # Both gates above ran here for weeks without their controls, while the proof-link gate
      # below has always had its suite as a sibling step. That asymmetry is the whole reason
      # these two are here: check-repo-paths.py spent its entire life passing on a dead citation
      # because its PATH_RE demanded an alphanumeric first character, so a leading dot never
      # matched and it was structurally blind to exactly the gitignored set it existed to police.
      # A gate with no control in CI cannot tell a clean repo from a blind checker, and both
      # print the same reassuring line.
      - name: the repo-path gate's controls actually gate
        run: python3 scripts/test_check_repo_paths.py

      - name: no gitignored copy shadows a tracked script
        run: python3 scripts/check-shadowed-scripts.py

      # Case 1 of this suite is the incident shape itself, a diverged staging copy of the
      # pay-page generator. Until this session both of that gate's scopes were hardcoded, and
      # one of them left webshop-pay/build.py unprotectable, which is the file whose drift
      # incident this project had already written up. If case 1 stops firing, the gate is blind.
      - name: the shadowed-script gate's controls actually gate
        run: python3 scripts/test_check_shadowed_scripts.py

      # A clickable explorer link is an offer of evidence, and public devnet stops serving a
      # transaction after about four days, so the only durable backing is the captured bytes in
      # the proof bundle. A link to a signature nobody captured renders identically to one that
      # is fully backed and decays into a dead end on someone else's schedule. Two of them sat in
      # DEVNET-PROOF's own table with the adjacent column correctly reading "pruned before
      # capture", which is why an accurate label is not a substitute for the link being real.
      #
      # This belongs on a runner rather than beside check-doc-links.py: it is pure git plus one
      # JSON file, no network, so it is green today and a red badge means a real regression. Its
      # own controls run in the step below.
      - name: every linked transaction is backed by captured bytes
        run: python3 scripts/check-proof-links.py

      # The step above is only worth something if it can tell a backed link from a dead one, and
      # a suite written alongside the code it tests can agree with a bug. These ten cases cover
      # three directions: must-fire on the two real incident shapes, must-not-fire on the
      # de-linked history form the gate steers toward, and must-refuse-to-pass when the bundle or
      # the scope derivation cannot be read at all. Case 1 is the verbatim table row that
      # shipped, so if it stops firing the gate is blind again.
      - name: the proof-link gate's controls actually gate
        run: python3 scripts/test_check_proof_links.py

      # check-doc-links.py itself stays manual because it needs the network and reports one
      # problem while the repository is private. Its SKIP classifier does not: it is pure regex
      # over strings, so it belongs on a runner, and a suite that only runs when someone
      # remembers to type it is how the loopback defect survived in the first place. Sixteen
      # cases in both directions, because must-skip alone would pass for a classifier that
      # skipped every URL and quietly stopped checking real links. Case 1 is the QUICKSTART URL
      # verbatim, and one case re-reads QUICKSTART so the suite fails rather than passes quietly
      # if it is ever guarding a shape the repository no longer has.
      - name: the link gate still skips illustrations and still checks real links
        run: python3 scripts/test_check_doc_links.py

      # The on-chain evidence outlives the links to it. Public devnet RPC prunes
      # after about four days, so every explorer link in DEVNET-PROOF is dead well
      # before judging. This verifies the captured raw transactions instead:
      # ed25519 over the serialized message, standard library only, no network. It
      # belongs on a runner precisely because it needs nothing but the repo, and it
      # self-gates on negative controls, so a green step means the checker was
      # shown to reject bad input on this run rather than merely printing PASS.
      - name: captured on-chain proofs verify with no network
        run: python3 scripts/verify_proof_offline.py

      # The step above defaults to the DEVNET bundle, which the verifier hardcodes.
      # So until this line existed, the mainnet custody proof -- three real-USDC
      # transactions ending in the audited program's 0x12c refusal, the single
      # strongest custody artifact here -- was asserted by NO ci step at all. It
      # verified only when a human ran it by hand with the flag, which is exactly
      # the shape of a claim that rots unnoticed: the suite stays green while the
      # thing it is supposed to protect is outside its scope. Named as a separate
      # step rather than folded into the one above, because a combined step that
      # went red would not say WHICH chain's evidence broke.
      - name: captured MAINNET custody proofs verify with no network
        run: python3 scripts/verify_proof_offline.py --bundle docs/proof-bundle/mainnet-transactions.json

      # The step above gates itself on its own controls, which is only worth
      # something if those controls can actually fail. This plants three defects in
      # a copy of the verifier and requires each to be refused by the control that
      # names it. The third mutant is the one that earns its keep: it makes a tamper
      # control perturb nothing, which is how a control ships green while covering
      # nothing. Writing this found a real gap, since the digest control tested
      # hashlib directly while the per-transaction loop compared separately, so a
      # broken comparison there was uncovered until both were routed through one
      # function.
      - name: the offline verifier's controls actually gate
        run: bash scripts/mutation-check-offline-proof.sh

      # The deployed checkout page and the generator that produces it drifted once, and
      # the drift was silent: index.html had gained the pinned merchant address, the
      # mint-keyed asset names, the wrong-recipient refusal and the Portuguese
      # translation, while build.py still held the version from before all four. Running
      # the generator would have reverted them, including the control that stops a
      # customer paying a wallet this shop does not own. This asserts they still agree,
      # which is a property a reader cannot check by eye on a 72 KB file.
      - name: the deployed pay page matches its sources
        run: python3 webshop-pay/build.py --check

      # The step above was the only gate in this job without a paired control, while its six
      # siblings all had one. It had been shown to fail by hand, once, which is not something a
      # later reader can re-run. Case 1 is the money shape: the page's pinned merchant address
      # swapped for 9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM, the wallet a real wrong-recipient
      # link on this project actually pointed at. If case 1 stops firing, the control that stops a
      # customer paying a wallet this shop does not own is being checked by nothing.
      #
      # Both swap directions are covered because drift has no preferred one, and every must-fire
      # edit is length-preserving on purpose: build.py's FAIL message prints the two character
      # counts, so a comparison "simplified" to those counts is the plausible weakening, and only a
      # same-length bucket detects it. That property is machine-asserted rather than left to a
      # comment. Nothing writes to webshop-pay/: each case builds a byte-for-byte fixture in a temp
      # directory, and the suite digests the eight real files before and after and refuses to
      # report a result if any moved.
      - name: the pay-page gate's controls actually gate
        run: python3 scripts/test_check_build_py.py

      # The compliance ledger claims slop-cleanliness across the judge-facing documents, and until
      # now the only checker for it lived in .tools/, which .gitignore ignores wholesale. A clone
      # received the claim and no way to check it, and nothing here ran it: this file gated rustfmt
      # across all 16 tracked crates and gated nothing at all on prose. That is a control that is
      # claimed, asserted, and enforced by no runtime path, which is the shape a judge disproves in
      # one command.
      #
      # Scope is derived from git ls-files rather than hand-listed, for the same reason the fmt job
      # derives its crate list, and it carries a floor that refuses a run discovering fewer than 29
      # documents, since a broken discovery step would otherwise print a perfect result over
      # nothing.
      - name: tracked markdown carries no slop markers
        run: python3 scripts/check-doc-slop.py

      # Every exemption this gate carries is a narrowing, and a narrowing looks exactly like a
      # disabled gate if the only evidence is that the tree went quiet. Case 4 is the required
      # prompt-injection transcript verbatim, whose six em-dashes sit inside the agent's recorded
      # replies, where rewriting them would falsify the evidence; case 8 plants slop in that file
      # outside every quote and must still fire. If case 8 stops firing, the blockquote skip has
      # widened into a whole-file exemption and the transcript is no longer checked at all.
      - name: the doc-slop gate's controls actually gate
        run: python3 scripts/test_check_doc_slop.py

  supply-chain:
    name: advisories, licenses, sources
    runs-on: ubuntu-latest
    # Every shipped graph, not a sample of three.
    #
    # Each plugin is its own workspace with its own dependency graph, so checking
    # some and claiming all is a real gap rather than a wording problem: the ones
    # left out were not redundant with the ones included. token-risk-check and
    # lending-health pull HTTP and JSON dependencies the other three never touch,
    # which is precisely where an advisory would land first.
    #
    # Every entry here passes locally, so the matrix is a standing gate rather
    # than a gamble on a red badge.
    #
    # The first nine went in clean. x402-feed-gate, the tenth, did not: it failed
    # on two licenses no plugin graph pulls, the root certificate bundle and the
    # TLS crates. Both are permissive and both were read rather than waved through
    # on the strength of the word appearing in a title, which is the whole
    # argument for running the gate over every shipped graph instead of a
    # representative sample. It was added because it ships and a judge reads it,
    # so leaving it outside a gate that covered the other nine was a real hole
    # rather than a wording problem. Re-verified 2026-07-26: advisories ok,
    # licenses ok, sources ok.
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - crates/solana-core
          - plugins/allowance-spend-build
          - plugins/depin-attest
          - plugins/lending-health
          - plugins/oracle-publish
          - plugins/payment-watch
          - plugins/solana-pay-request
          - plugins/spl-transfer-build
          - plugins/token-risk-check
          - x402-feed-gate
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
          manifest-path: ${{ matrix.manifest }}/Cargo.toml
          arguments: --config deny.toml

  plugins:
    name: plugin ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - allowance-spend-build
          - depin-attest
          - lending-health
          - oracle-publish
          - payment-watch
          - solana-pay-request
          - spl-transfer-build
          - token-risk-check
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/${{ matrix.plugin }}

      # Plugin tests are offline by design: RPC is mocked, nothing reaches the network.
      - name: Host tests
        working-directory: plugins/${{ matrix.plugin }}
        run: cargo test --lib --locked

      - name: Build the wasm component
        working-directory: plugins/${{ matrix.plugin }}
        run: cargo build --target wasm32-wasip2 --release --locked
