name: proof-check

# The submission claims two agents that are actually running, and a set of on-chain
# facts anyone can open. This re-checks those facts on a schedule, from a clean
# machine that is not ours, so "yours, running" is a continuously auditable claim
# rather than a screenshot taken once on a good day.
#
# Deliberately separate from ci.yml: this one depends on public devnet RPC being
# reachable, and a third-party outage must never turn the build badge red.
#
# A genuine failure here is the alarm we want: it means the feed went stale or a
# published claim stopped holding.

on:
  schedule:
    # Twice daily. The feed publishes every 20 minutes from the ARM node, so a
    # stale feed shows up well inside one interval.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify-proof.py"
      - "docs/DEVNET-PROOF.md"
      - ".github/workflows/proof-check.yml"

jobs:
  devnet-claims:
    name: every published on-chain claim still holds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Retry only transient RPC unreachability. A real FAIL (a claim that stopped
      # holding) exits 1 on the first attempt and we do not want to paper over it,
      # but a public endpoint refusing one request is not a finding.
      - name: Verify against devnet
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if python3 scripts/verify-proof.py 2>&1 | tee /tmp/proof.log; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -qiE "unreachable|timed out|connection|HTTP Error 5" /tmp/proof.log; then
              echo "A published claim stopped holding. Not a transport problem."
              exit 1
            fi
            sleep 20
          done
          echo "devnet RPC was unreachable on three attempts"
          exit 1
