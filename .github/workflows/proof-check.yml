name: proof-check

# The submission claims two agents that are actually running, and a set of on-chain
# facts anyone can open. This re-checks those facts on a schedule, from a clean
# machine that is not ours, so "yours, running" is a continuously auditable claim
# rather than a screenshot taken once on a good day.
#
# Deliberately separate from ci.yml: this one depends on public devnet RPC being
# reachable, and a third-party outage must never turn the build badge red.
#
# A genuine failure here is the alarm we want: it means the feed went stale or a
# published claim stopped holding.

# Least privilege, declared here rather than inherited. Without this block the token's scope comes
# from the repo-level "default workflow permissions" setting, which is currently read -- so this was
# safe by a checkbox rather than by anything in the file. Flipping that default to read-and-write
# would silently hand a write token to a workflow that runs third-party actions, and nothing in the
# diff would show it. Declaring it makes the grant reviewable.
permissions:
  contents: read

on:
  schedule:
    # Twice daily. The feed publishes every 20 minutes from the ARM node, so a
    # stale feed shows up well inside one interval.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/verify-proof.py"
      - "scripts/verify_proof_ledger_control.py"
      - "scripts/verify_proof_selfcheck_control.py"
      - "scripts/check-deploy-content-staleness.py"
      - "deploy/deploy-targets.json"
      - "docs/DEVNET-PROOF.md"
      - ".github/workflows/proof-check.yml"

jobs:
  devnet-claims:
    name: every published on-chain claim still holds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # FULL history, because check-deploy-content-staleness.py resolves the commit the BOX
      # reports it was deployed from, and that commit is weeks behind the tip. On the default
      # depth-1 clone it is absent, and the gate then reports CANNOT VERIFY forever: an honest
      # verdict that answers nothing, and one that looks identical to a healthy quiet check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Retry only transient RPC unreachability. A real FAIL (a claim that stopped
      # holding) must not be papered over, but a public endpoint refusing one request
      # is not a finding.
      #
      # This used to decide which was which by grepping the script's own prose for
      # words like "unreachable". That read the whole log, including the non-gating
      # secondary-feed line, which prints that exact word when its read fails. So a
      # genuine broken claim landing in the same run as a secondary blip was retried
      # three times and then reported as an RPC problem rather than as the claim that
      # actually broke. The script now says which it had, and this branches on the
      # number: 0 all good, 2 transport only and retryable, anything else a real
      # finding. A mixed run exits 1 by design.
      - name: Verify against devnet
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            python3 scripts/verify-proof.py 2>&1 | tee /tmp/proof.log
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            case "$rc" in
              0)
                exit 0
                ;;
              2)
                echo "Transport only on attempt $attempt; retrying."
                sleep 20
                ;;
              *)
                echo "A published claim stopped holding. Not a transport problem."
                exit 1
                ;;
            esac
          done
          echo "devnet RPC was unreachable on three attempts"
          exit 1

      # THE CONTROLS FOR THE STEP ABOVE, and they ran nowhere until now. Two of that script's
      # claims are OPTIONAL: they print PENDING against a node whose build predates them, and a
      # claim whose only observed output is PENDING has not been shown to work. It would keep
      # printing PENDING just as happily with its verdict logic deleted, and would keep printing
      # it after the feature shipped and the check quietly stopped running.
      #
      # Each control serves crafted payloads from a loopback server and requires the checker to
      # reach the right verdict on every branch, including each FAIL. So a green run above means
      # the claims held, rather than that a blind checker found nothing.
      #
      # Placed HERE rather than in ci.yml deliberately: both controls run verify-proof.py as a
      # subprocess, which makes real RPC calls, and a third-party endpoint refusing a request
      # must never turn a pull request red. This workflow already owns that dependency.
      - name: the optional live claims can actually go red
        run: |
          set -o pipefail
          python3 scripts/verify_proof_ledger_control.py
          python3 scripts/verify_proof_selfcheck_control.py

      # IS THE BOX RUNNING THE CODE THIS REPO DESCRIBES. Nothing above answers that. The box's
      # own self-check compares it to the commit it was DEPLOYED FROM, so a box months behind
      # reports a green manifest, honestly, because it does match that snapshot. Measured on
      # 2026-08-16: a green manifest, and 8 of 14 mapped files not what main says they are.
      #
      # A SEPARATE STEP so its red is legible. A failure here means the box is behind, which is
      # a different alarm from an on-chain claim that stopped holding and has a different fix,
      # and folding the two into one step would make the badge say neither.
      #
      # `continue-on-error` is deliberately NOT set. A stale deploy on the money path is the
      # alarm this workflow exists to raise, and a step allowed to fail quietly is a step
      # nobody reads.
      #
      # RETRIED THE SAME WAY THE DEVNET STEP ABOVE IS, and for the reason in this file's own
      # header: a third-party outage must never turn the badge red. The gate already separates
      # the two cases by exit code, so the retry keys on that rather than on its prose: 2 is
      # "the endpoint did not answer", which is retryable and says nothing about the deploy, and
      # 1 is a real drift finding that must fail on the first attempt rather than being tried
      # three times as though the box might change its mind.
      - name: the box is running the content on main
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            python3 scripts/check-deploy-content-staleness.py
            rc=$?
            case "$rc" in
              0) exit 0 ;;
              2)
                echo "Could not reach the box on attempt $attempt; retrying."
                sleep 20
                ;;
              *)
                echo "The box is not running the content on main. Not a transport problem."
                exit 1
                ;;
            esac
          done
          echo "the box self-check endpoint was unreachable on three attempts"
          exit 1
