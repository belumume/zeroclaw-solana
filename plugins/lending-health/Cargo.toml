[package]
name = "lending-health"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZeroClaw tool plugin: read-only Kamino Lend position health (liquidation risk) for a wallet."
publish = false

# cdylib for the wasm component; rlib so the pure health core is host-testable
# with a plain `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solana-core = { path = "../../crates/solana-core" }
wit-bindgen = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# wasi:http client — only compiled for the wasm component, never on the host.
[target.'cfg(target_family = "wasm")'.dependencies]
waki = { version = "0.5.1", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Standalone crate: built for wasm32-wasip2, depends on solana-core by path.
[workspace]
