name = "spl-transfer-build"
version = "0.1.0"
description = "Build an UNSIGNED versioned (v0) SPL-token or native-SOL transfer for a human approval gate: derives + idempotently creates the recipient ATA, attaches an on-chain memo for invoice reconciliation, appends reference keys for payment-watch, and (durable-nonce mode) fronts the transaction with an advance-nonce so it survives the approval queue indefinitely. Returns base64 + a human-readable summary; the plugin holds no wallet."
author = "belumume"
wasm_path = "spl_transfer_build.wasm"
capabilities = ["tool"]
# http_client: outbound HTTPS to the Solana JSON-RPC endpoint (getAccountInfo on
# the mint for decimals+owner, getAccountInfo on the recipient ATA to decide
# whether to create it, and either getLatestBlockhash or getAccountInfo on the
# durable-nonce account). TLS is host-side.
# config_read: the jailed operator config holding the fee-payer/authority pubkey
# (payer_pubkey), an optional durable-nonce account + its authority, and an
# optional https RPC override. NO private key is ever read.
# Custody tier T1 (unsigned-transaction builder): the plugin holds no wallet and
# no key material. It returns an UNSIGNED versioned transaction (every signature
# slot left empty) for a human approval gate to render and the host to sign, so
# the plugin output alone can never be broadcast and no funds are ever moved by
# the plugin.
permissions = ["http_client", "config_read"]

[custody]
# MACHINE-CHECKED by scripts/check-custody-tier.py, which reads these back out of the
# shipped .wasm's import table. They are properties of the compiled artifact rather than
# of this comment: a capability absent from that table has no host function to be called
# through, whatever the source says. Re-derive from this directory with
#   cargo build --target wasm32-wasip2 --release
#   python3 ../../scripts/check-custody-tier.py
tier = "T1"
network_reachable = true
filesystem = false
host_capabilities = [
    "clock",
    "environment",
    "host-logging",
    "host-types",
    "io-streams",
    "network-http",
    "process-exit",
    "random-insecure",
    "stdio",
]
# DECLARED, NOT CHECKED, and labelled rather than dropped. Neither is decidable from an
# import table: signing is pure computation that imports nothing, and operator config
# arrives as a `__config` field inside the tool arguments, crossing no import boundary.
# `config_injected` is cross-checked against `permissions` above, which is a
# manifest-internal consistency check and not a claim about the binary.
signs = false
config_injected = true
