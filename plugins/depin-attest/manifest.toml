name = "depin-attest"
version = "0.1.0"
description = "Sign and broadcast a replay-proof on-chain attestation of a physical DePIN sensor reading (motion/contact/tamper), fronted by a durable nonce so each attestation is single-use"
author = "belumume"
wasm_path = "depin_attest.wasm"
capabilities = ["tool"]
# http_client: outbound HTTPS to the Solana JSON-RPC endpoint (getAccountInfo +
# sendTransaction). TLS is host-side.
# config_read: the jailed operator config holding the scoped ed25519 session
# seed (signer_seed_hex) + the owned durable-nonce account + optional https RPC.
# Custody tier T2: signs with a SCOPED session key only — holds no user wallet,
# can only ever emit one transaction shape (advance-nonce + attestation memo),
# and replay is enforced by the chain via the durable nonce.
permissions = ["http_client", "config_read"]

[custody]
# MACHINE-CHECKED by scripts/check-custody-tier.py, which reads these back out of the
# shipped .wasm's import table. They are properties of the compiled artifact rather than
# of this comment: a capability absent from that table has no host function to be called
# through, whatever the source says. Re-derive from this directory with
#   cargo build --target wasm32-wasip2 --release
#   python3 ../../scripts/check-custody-tier.py
tier = "T2"
network_reachable = true
filesystem = false
host_capabilities = [
    "clock",
    "environment",
    "host-logging",
    "host-types",
    "io-streams",
    "network-http",
    "process-exit",
    "random-insecure",
    "stdio",
]
# DECLARED, NOT CHECKED, and labelled rather than dropped. Neither is decidable from an
# import table: signing is pure computation that imports nothing, and operator config
# arrives as a `__config` field inside the tool arguments, crossing no import boundary.
# `config_injected` is cross-checked against `permissions` above, which is a
# manifest-internal consistency check and not a claim about the binary.
signs = true
config_injected = true
