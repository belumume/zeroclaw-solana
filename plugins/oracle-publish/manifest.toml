name = "oracle-publish"
version = "0.1.0"
description = "Publish a device-signed sensor reading into a typed, program-owned on-chain DeviceFeed that downstream Solana programs consume; returns a base64 partial transaction the host completes and broadcasts (plugin holds no wallet)"
author = "belumume"
wasm_path = "oracle_publish.wasm"
capabilities = ["tool"]
# http_client: outbound HTTPS to the Solana JSON-RPC endpoint (getAccountInfo on
# the durable-nonce account). TLS is host-side.
# config_read: the jailed operator config holding the scoped DEVICE identity
# seed (signer_seed_hex), the durable-nonce account, the oracle program id, the
# agent session pubkey (fee payer), and an optional https RPC override.
# Custody tier T1 (fund-less partial signing): the device key signs the reading
# only; the fee-payer slot is left EMPTY for the host's capped session key, so
# the plugin output alone can never be broadcast and no funds are ever held.
permissions = ["http_client", "config_read"]

[custody]
# MACHINE-CHECKED by scripts/check-custody-tier.py, which reads these back out of the
# shipped .wasm's import table. They are properties of the compiled artifact rather than
# of this comment: a capability absent from that table has no host function to be called
# through, whatever the source says. Re-derive from this directory with
#   cargo build --target wasm32-wasip2 --release
#   python3 ../../scripts/check-custody-tier.py
tier = "T1"
network_reachable = true
filesystem = false
host_capabilities = [
    "clock",
    "environment",
    "host-logging",
    "host-types",
    "io-streams",
    "network-http",
    "process-exit",
    "random-insecure",
    "stdio",
]
# DECLARED, NOT CHECKED, and labelled rather than dropped. Neither is decidable from an
# import table: signing is pure computation that imports nothing, and operator config
# arrives as a `__config` field inside the tool arguments, crossing no import boundary.
# `config_injected` is cross-checked against `permissions` above, which is a
# manifest-internal consistency check and not a claim about the binary.
signs = true
config_injected = true
