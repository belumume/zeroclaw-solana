<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Pay with Solana</title><style>
:root{color-scheme:light dark}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8eaed;display:flex;min-height:100vh;align-items:safe center;justify-content:safe center;padding:20px}
.card{max-width:390px;width:100%;background:#171a21;border:1px solid #262b36;border-radius:18px;padding:26px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.4)}
h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#8a93a6;margin:0 0 4px;font-weight:600}
#label{font-size:22px;font-weight:700;margin:2px 0}
#amt{font-size:30px;font-weight:800;color:#14f195;margin:6px 0 2px}
#msg{color:#b6bdca;margin:0 0 14px}
.paid{font-size:34px;font-weight:800;color:#14f195;margin:18px 0}
#qr{background:#fff;border-radius:12px;padding:10px;display:inline-block;margin:8px 0}
#qr img{display:block;width:190px;height:190px;image-rendering:pixelated}
@media (min-width:430px){#qr img{width:260px;height:260px}}
.scan{font-size:13px;color:#8a93a6;margin:4px 0 12px}
.recip{font-size:13px;color:#8a93a6;margin:4px 0 16px;font-family:ui-monospace,monospace}
/* An 88-char base58 signature has no break opportunity in it, so without this the already-paid
   card widens past the viewport and the whole page scrolls sideways: measured +286px at 390.
   Deliberately its own class rather than a rule on .recip, so the payable card and the
   wrong-recipient refusal -- one of which is the opening shot's plate, keyed to a measured
   delta-x of 0.00 at 390 -- keep exactly the layout they were verified with. */
.brk{overflow-wrap:anywhere}
button#pay{width:100%;background:#ab9ff2;color:#1a1035;font-weight:700;border:0;padding:15px;border-radius:12px;font-size:17px;cursor:pointer;margin:4px 0}
button#pay:disabled{opacity:.55}
/* The wallet picker, shown only after a click and IN PLACE OF the pay button, so the card's
   height is unchanged until the customer asks. The earlier version listed wallets on load and
   pushed the QR below the fold, which then needed a whole two-pane layout to undo.
   THE CAP IS THE SAME DEFECT ONE STEP LATER: deferring to the click keeps the geometry until
   asked, and says nothing about after. A browser with eight wallets registered grew the card by
   399px and pushed the QR out of view at 1280x900 and at 390x844, measured. Capping the list makes
   a long one scroll inside itself, so the phone path stays reachable however many are installed.
   The last-used wallet is hoisted to the top by renderWalletPicker, so the cap cannot hide it. */
#wallets{display:flex;flex-direction:column;gap:8px;margin:4px 0;max-height:212px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
button.wallet-btn{display:flex;align-items:center;gap:10px;width:100%;background:#20242e;color:#e8eaed;border:1px solid #333a47;padding:13px;border-radius:12px;font-size:15px;cursor:pointer;text-align:left}
button.wallet-btn:hover{border-color:#ab9ff2}
button.wallet-btn:disabled{opacity:.55;cursor:default}
button.wallet-btn img{width:22px;height:22px;border-radius:5px;flex:0 0 auto}
/* Same 22px slot as a real icon, so a wallet without one keeps the row's alignment instead of
   leaving a hole. Sized and positioned identically to the img above; only the fill differs. */
button.wallet-btn .noicon{width:22px;height:22px;border-radius:5px;flex:0 0 auto;background:#2b3240;color:#8b93a7;font-style:normal;font-size:12px;font-weight:700;line-height:22px;text-align:center}
button.wallet-btn .lastused{margin-left:auto;font-style:normal;font-size:12px;color:#8b93a7}
button#copy{width:100%;background:#20242e;color:#e8eaed;border:1px solid #333a47;padding:11px;border-radius:12px;font-size:14px;cursor:pointer;margin:8px 0}
.or{color:#5c6473;font-size:12px;letter-spacing:.08em;margin:14px 0 8px}
.status{font-size:13px;color:#b6bdca;min-height:18px;margin:10px 0 0}
.status.err{color:#ff8a8a}
.link{color:#14f195;display:inline-block;margin-top:8px}
.hint{font-size:12.5px;color:#8a93a6;margin:14px 0 0;line-height:1.5}
.err{color:#ff6b6b}
.net{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#f0a35e;border:1px solid #4a3826;border-radius:20px;padding:3px 10px;margin-top:14px}
</style></head><body>
<div class=card id=card>
<h1>Solana Pay</h1>
<div id=label>Payment</div>
<div id=amt></div>
<div id=msg></div>
<button id=pay>Connect wallet &amp; pay</button>
<div class=or>OR SCAN WITH A PHONE WALLET</div>
<div id=qr></div>
<div class=scan>Open Phantom or Solflare on your phone, scan this.</div>
<div class=recip>to <span id=recip></span></div>
<button id=copy>Copy Solana Pay link</button>
<div id=status class=status></div>
<p class=hint>Desktop: click <b>Connect wallet &amp; pay</b> (Phantom/Solflare extension). Phone: scan the QR with your wallet app. Mainnet: this is real USDC, and your wallet needs a little SOL for the fee.</p>
<span class=net>Mainnet</span>
</div>
<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';

// Rendered IN PLACE OF the pay button, and only after a click. The original listed every wallet on
// load, which is what pushed the QR below the fold and needed a two-pane layout to fix. Deferring
// it to the click keeps this page's single-column geometry byte-identical until the customer asks,
// so the phone plate the opening shot is keyed to cannot move.
function renderWalletPicker(list){
  var host=el('pay').parentNode,box=document.createElement('div');box.id='wallets';
  var last=null;try{last=localStorage.getItem('zeroclaw_last_wallet')}catch(_){}
  // The box is height-capped and scrolls, so the wallet the customer is most likely to want must
  // not sit below the fold of its own list. Hoist the last-used one; everything else keeps
  // registration order, which is arbitrary but stable. Copy rather than sort in place: the
  // caller's array is the enumeration result and reordering it is a side effect nobody asked for.
  var ordered=list.slice();
  if(last)ordered.sort(function(a,b){return (b.name===last)-(a.name===last)});
  ordered.forEach(function(w){
    var b=document.createElement('button');b.className='wallet-btn';b.type='button';
    // A wallet with no usable icon gets a lettered chip rather than an empty slot. Cause-independent
    // on purpose: whether the wallet supplies nothing, supplies an http URL we refuse, or supplies a
    // shape we cannot read, the row must not render as a hole. Magic Eden showed up blank this way.
    if(iconOK(w.icon)){var img=document.createElement('img');img.src=w.icon;img.alt='';b.appendChild(img);}
    else{var ph=document.createElement('em');ph.className='noicon';ph.setAttribute('aria-hidden','true');ph.textContent=((w.name||'?').trim().charAt(0)||'?').toUpperCase();b.appendChild(ph);}
    var s=document.createElement('span');s.textContent=w.name;b.appendChild(s);
    if(w.name===last){var t=document.createElement('em');t.className='lastused';t.textContent=T('lastused','last used');b.appendChild(t);}
    b.onclick=function(){box.parentNode&&box.parentNode.removeChild(box);payWith(w);};
    box.appendChild(b);
  });
  el('pay').style.display='none';host.insertBefore(box,el('pay').nextSibling);
}
async function connectAndPay(){
  var list=enumerateWallets();
  if(!list.length){status('No Solana wallet extension detected in this browser. Install Phantom or Solflare (desktop), or scan the QR above with a phone wallet.','err');return;}
  // One wallet is not a choice. A picker with a single option is a pointless extra click.
  if(list.length===1)return payWith(list[0]);
  status(T('choosewallet','Choose a wallet.'));
  renderWalletPicker(list);
}
async function payWith(w){
  try{localStorage.setItem('zeroclaw_last_wallet',w.name)}catch(_){}
  el('pay').disabled=true;status(T('loadinglibs','Loading Solana libraries…'));
  try{
    var web3=(await import('/vendor/solana-bundle.js')).web3;
    // Mainnet, from the single constant at the top. Used for reads only -- getMint, the two
    // getAccount preflights and getLatestBlockhash. It never signs and never broadcasts: the
    // wallet does both, via its own RPC. web3.js opens its websocket lazily, on the first
    // subscription, and this page makes none now that confirmation is a poll, so no websocket is
    // ever opened here.
    var conn=new web3.Connection(RPC,'confirmed');
    status(T('connecting','Connecting ')+w.name+'…');
    // Two interfaces, because both kinds of wallet are real. A Wallet Standard wallet hands back
    // accounts whose address is a base58 string; a legacy injected provider hands back a PublicKey.
    var payer,wsAccount=null;
    if(w._legacy){var resp=await w._legacy.connect();payer=resp.publicKey||w._legacy.publicKey;}
    else{
      var out=await w.features['standard:connect'].connect();
      if(!out||!out.accounts||!out.accounts.length)throw new Error('wallet returned no account');
      wsAccount=out.accounts[0];
      payer=new web3.PublicKey(wsAccount.address);
    }
    var recipientPk=new web3.PublicKey(recip);
    var refPk=reference?new web3.PublicKey(reference):null;
    var tx=new web3.Transaction();
    if(token){
      status(T('building','Building token transfer…'));
      var spl=(await import('/vendor/solana-bundle.js')).spl;
      var mint=new web3.PublicKey(token);
      var mintInfo=await spl.getMint(conn,mint);
      var fromAta=await spl.getAssociatedTokenAddress(mint,payer);
      var toAta=await spl.getAssociatedTokenAddress(mint,recipientPk);
      var amt=BigInt(Math.round(parseFloat(amount)*Math.pow(10,mintInfo.decimals)));
      // same allowlist as the headline, so the two cannot drift into disagreeing
      // about what the customer is being asked to pay.
      var knownName=KNOWN_MINTS[token];
      // preflight: the payer must actually hold the token, else the wallet returns a cryptic
      // "Internal error". Detect it and say exactly what is short, by how much.
      var have=-1n;try{have=(await spl.getAccount(conn,fromAta)).amount;}catch(e2){have=-1n;}
      if(have<amt){
        var haveStr=have<0n?'0':(Number(have)/Math.pow(10,mintInfo.decimals)).toString();
        var needStr=(Number(amt)/Math.pow(10,mintInfo.decimals)).toString();
        // No faucet line on mainnet: there is no faucet, and pointing a customer at one for
        // real USDC would be advice that cannot be followed. State the shortfall and stop.
        status(T('holds','This wallet holds ')+haveStr+(knownName?' '+knownName:' of the requested token')+', needs '+needStr+'. Fund this wallet on Solana mainnet, then retry.','err');
        el('pay').disabled=false;return;
      }
      // ensure the recipient's token account exists (idempotent; payer funds the tiny rent) so
      // the transfer can never fail on a missing destination account.
      try{await spl.getAccount(conn,toAta);}catch(e3){tx.add(spl.createAssociatedTokenAccountIdempotentInstruction(payer,toAta,recipientPk,mint));}
      var ix=spl.createTransferCheckedInstruction(fromAta,mint,toAta,payer,amt,mintInfo.decimals);
      if(refPk)ix.keys.push({pubkey:refPk,isSigner:false,isWritable:false});
      tx.add(ix);
    }else{
      var ix2=web3.SystemProgram.transfer({fromPubkey:payer,toPubkey:recipientPk,lamports:Math.round(parseFloat(amount)*web3.LAMPORTS_PER_SOL)});
      if(refPk)ix2.keys.push({pubkey:refPk,isSigner:false,isWritable:false});
      tx.add(ix2);
    }
    tx.feePayer=payer;
    tx.recentBlockhash=(await conn.getLatestBlockhash()).blockhash;
    status(T('approve','Approve the payment in your wallet…'));
    // Same split as the connect above. A legacy provider returns an object carrying a base58
    // signature string; a Wallet Standard wallet returns raw signature BYTES.
    //
    // The first version reached for a bs58 helper off the web3 namespace. There is no such export:
    // the string appears zero times in the vendored bundle, so it would have thrown or produced
    // garbage on a real payment. Caught by grepping the bundle rather than by reading the code,
    // which is the only reason it is not in this commit. b58 is inline instead and is checked
    // against an independent encoder in demo/verify_wallet_picker.py.
    //
    // The symbol is deliberately NOT spelled in the dotted form here. verify_no_cdn_dependency.py
    // extracts every web3.<symbol> from this file and asserts the bundle exports it, so naming a
    // known-absent symbol inside a comment ABOUT its absence turns that gate red. Same shape as a
    // prohibition that has to name what it forbids.
    var sig;
    if(w._legacy){sig=await w._legacy.signAndSendTransaction(tx);}
    else{
      tx.feePayer=payer;
      var out2=await w.features['solana:signAndSendTransaction'].signAndSendTransaction({
        account:wsAccount,   // captured at connect; a second connect would re-prompt the wallet
        transaction:tx.serialize({requireAllSignatures:false,verifySignatures:false}),
        chain:'solana:mainnet'
      });
      sig={signature:b58(out2[0].signature)};
    }
    var s=(sig&&sig.signature)?sig.signature:sig;
    status(T('confirming','Sent. Confirming on-chain…'));
    renderOutcome(await awaitConfirmation(s),s);
  }catch(e){status(T('failed','Payment did not complete: ')+(e&&e.message?String(e.message):String(e)),'err');el('pay').disabled=false;}
}
</script></body></html>
